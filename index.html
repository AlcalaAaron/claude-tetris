<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-switch">
          <label class="theme-switch-toggle">
            <input type="checkbox" id="theme-toggle" />
            <span class="theme-switch-slider"></span>
          </label>
          <span class="theme-switch-label" id="theme-toggle-label">Modo oscuro</span>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-entry" class="name-entry hidden">
          <span class="label">¡Nuevo récord! Introduce tu nombre</span>
          <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" />
          <button id="name-submit-btn">Guardar</button>
        </div>
        <div class="records-section">
          <span class="label">TABLA DE RÉCORDS LOCAL</span>
          <ol id="overlay-records-list" class="records-list"></ol>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title" class="game-title-overlay">TETRIS</p>
        <div class="records-section">
          <span class="label">TABLA DE RÉCORDS LOCAL</span>
          <ol id="start-records-list" class="records-list"></ol>
        </div>
        <p id="start-stats" class="stats-line"></p>
        <button id="start-btn">Jugar</button>
        <button id="reset-records-btn" class="secondary-btn">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
